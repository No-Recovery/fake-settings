<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0d">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Vo1dek — проекты</title>
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <link rel="icon" href="/static/wtf.gif" type="image/gif">
    <style>
        :root {
            --bg: #0a0a0d;
            --line: rgba(255, 255, 255, .09);
            --line-2: rgba(255, 255, 255, .05);
            --ink: #eceaf1;
            --dim: #9a94a6;
            --faint: #6a6478;
            --accent: #a855f7;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }
        .wrap {
            width: 100%;
            max-width: 460px;
            padding: calc(env(safe-area-inset-top, 0px) + 24px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
        }
        .top {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 0 2px 14px;
        }
        .mark {
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -.04em;
            color: var(--accent);
        }
        .tag {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--faint);
        }
        .cnt {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--faint);
        }
        .mods {
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, .015);
        }
        .mod {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 15px;
            color: inherit;
            text-decoration: none;
        }
        .mod + .mod { border-top: 1px solid var(--line-2); }
        .mod:active { background: rgba(168, 85, 247, .09); }
        .mod__n {
            width: 20px;
            flex: 0 0 auto;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--faint);
        }
        .mod__ic {
            width: 44px;
            height: 44px;
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #141317;
            object-fit: cover;
        }
        .mod__tx { flex: 1; min-width: 0; }
        .mod__tx b {
            display: block;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -.01em;
        }
        .mod__tx i {
            display: block;
            margin-top: 2px;
            font-style: normal;
            font-size: 12.5px;
            color: var(--dim);
        }
        .mod__go {
            flex: 0 0 auto;
            font-family: var(--mono);
            font-size: 15px;
            color: var(--faint);
        }
        .mod:active .mod__go { color: var(--accent); }
        .note {
            margin-top: 16px;
            padding: 0 2px;
            font-family: var(--mono);
            font-size: 10.5px;
            line-height: 1.6;
            color: var(--faint);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="top">
            <span class="mark">V/</span>
            <span class="tag">Vo1dek · проекты</span>
            <span class="cnt">2</span>
        </header>

        <nav class="mods">
            <a class="mod" href="/settings">
                <span class="mod__n">01</span>
                <img class="mod__ic" src="/static/icon-180.png" alt="">
                <span class="mod__tx">
                    <b>Fake Settings</b>
                    <i>настройки iPhone в браузере</i>
                </span>
                <span class="mod__go">&#8594;</span>
            </a>
            <a class="mod" href="https://no-recovery.github.io/shake-icons/" target="_blank" rel="noopener">
                <span class="mod__n">02</span>
                <img class="mod__ic" src="/static/gravition-180.png" alt="">
                <span class="mod__tx">
                    <b>Gravition</b>
                    <i>иконки со скриншотов</i>
                </span>
                <span class="mod__go">&#8599;</span>
            </a>
        </nav>

        <p class="note">добавь страницу на экран «Домой» — откроется это меню</p>
    </div>
</body>
</html>
