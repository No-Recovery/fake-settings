<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Проекты</title>
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <link rel="icon" href="/static/wtf.gif" type="image/gif">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 420px;
            margin: 0 auto;
            padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            padding: 10px 4px 14px;
        }
        .group {
            background: #1c1c1e;
            border-radius: 12px;
            overflow: hidden;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: #fff;
            text-decoration: none;
            position: relative;
        }
        .row:active { background: #2c2c2e; }
        .row + .row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 60px;
            right: 0;
            height: 0.5px;
            background: #38383a;
        }
        .ic {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ic.blue { background: linear-gradient(180deg, #3b82f6, #2563eb); }
        .ic.grey { background: #48484a; font-size: 20px; }
        .tx { flex: 1; min-width: 0; }
        .tx b { display: block; font-size: 17px; font-weight: 400; }
        .tx span { display: block; font-size: 13px; color: #8e8e93; margin-top: 1px; }
        .arr { color: #48484a; font-size: 20px; flex: 0 0 auto; }
        .foot {
            font-size: 13px;
            color: #8e8e93;
            padding: 10px 12px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Проекты</h1>

        <div class="group">
            <a class="row" href="/settings">
                <span class="ic blue"><img src="/static/icon-180.png" alt=""></span>
                <span class="tx">
                    <b>Fake Settings</b>
                    <span>Настройки iPhone в браузере</span>
                </span>
                <span class="arr">&#8250;</span>
            </a>
            <a class="row" href="https://no-recovery.github.io/shake-icons/" target="_blank" rel="noopener">
                <span class="ic grey">&#128241;</span>
                <span class="tx">
                    <b>Gravition Tweak</b>
                    <span>Иконки со скриншотов — играй гироскопом</span>
                </span>
                <span class="arr">&#8250;</span>
            </a>
        </div>

        <p class="foot">Fake Settings добавляется на домашний экран через «Поделиться» → «На экран “Домой»».</p>
    </div>

    <script>
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
            location.replace('/settings');
        }
    </script>
</body>
</html>
