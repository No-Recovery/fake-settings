<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0512">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Vo1dek — проекты</title>
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <link rel="icon" href="/static/wtf.gif" type="image/gif">
    <style>
        :root {
            --bg: #0a0512;
            --panel: rgba(28, 19, 44, .86);
            --line: rgba(168, 85, 247, .22);
            --ink: #f6f1ff;
            --dim: #b3a4cc;
            --faint: #7d7097;
            --accent: #a855f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { min-height: 100%; }
        body {
            background:
                radial-gradient(95% 46% at 50% -8%, rgba(124, 58, 237, .55), transparent 66%),
                radial-gradient(70% 40% at 110% 105%, rgba(88, 28, 135, .38), transparent 70%),
                linear-gradient(180deg, #150a26 0%, #0a0512 46%, #050209 100%);
            background-attachment: fixed;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            width: 100%;
            max-width: 440px;
            padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px calc(env(safe-area-inset-bottom, 0px) + 26px);
        }
        .hero { text-align: center; }
        .eyebrow {
            font-size: 11px;
            letter-spacing: .34em;
            text-transform: uppercase;
            color: #b794f6;
            opacity: .9;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.03em;
            background: linear-gradient(100deg, #f3e8ff, #c084fc 55%, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .lead {
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.45;
            color: var(--dim);
        }
        .apps {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px 12px 18px;
            border-radius: 24px;
            color: inherit;
            text-decoration: none;
            background: linear-gradient(180deg, rgba(45, 30, 66, .9), rgba(23, 15, 37, .92));
            border: 1px solid var(--line);
            box-shadow: 0 18px 40px -28px #000, inset 0 1px 0 rgba(255, 255, 255, .05);
            transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
        }
        .app:active {
            transform: scale(.96);
            border-color: rgba(168, 85, 247, .5);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, .12);
        }
        .app__icon {
            width: 74px;
            height: 74px;
            border-radius: 19px;
            overflow: hidden;
            background: #1c1330;
            box-shadow: 0 12px 26px -12px rgba(168, 85, 247, .7);
        }
        .app__icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .app__name { margin-top: 13px; font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
        .app__sub { margin-top: 5px; font-size: 12px; line-height: 1.35; color: var(--faint); }
        .foot {
            margin-top: 26px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            color: var(--faint);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="hero">
            <p class="eyebrow">Vo1dek</p>
            <h1>Проекты</h1>
            <p class="lead">Выбери приложение</p>
        </header>

        <nav class="apps">
            <a class="app" href="/settings">
                <span class="app__icon"><img src="/static/icon-180.png" alt=""></span>
                <span class="app__name">Fake Settings</span>
                <span class="app__sub">Настройки iPhone в браузере</span>
            </a>
            <a class="app" href="https://no-recovery.github.io/shake-icons/" target="_blank" rel="noopener">
                <span class="app__icon"><img src="/static/gravition-180.png" alt=""></span>
                <span class="app__name">Gravition</span>
                <span class="app__sub">Иконки со скриншотов</span>
            </a>
        </nav>

        <p class="foot">Добавь эту страницу на домашний экран — меню всегда будет под рукой.</p>
    </div>
</body>
</html>
