    function isModelStub(v) {
        return v === 'iPhone 17 Pro' || v === 'Android' || v === 'K' || /Build\//.test(v || '') || !v;
    }
    function detectDeviceModel() {
        var ua = navigator.userAgent || '';
        if (/iPhone/.test(ua)) return 'iPhone';
        if (/iPad/.test(ua)) return 'iPad';
        if (/iPod/.test(ua)) return 'iPod touch';
        if (/Android/.test(ua)) {
            var a = ua.match(/Android [\d.]+;\s*([^;()]+)/);
            var mm = a && a[1] && a[1].trim();
            if (mm) mm = mm.split(/\s+Build\b/i)[0].trim();
            if (mm && mm.length > 1 && mm !== 'K') return mm;
            return '';
        }
        return '';
    }
    function autoDetectModel() {
        // Заполняется реальной моделью устройства, пока значение — заглушка (дефолт/«K»/«Android»).
        // Если пользователь поменял «Название модели» вручную — его значение сохраняется.
        if (isModelStub(S.model)) {
            // 1) Модель от сервера (Sec-CH-UA-Model) — самый надёжный источник на Android Chrome
            var m = (UA_MODEL && UA_MODEL !== 'K') ? UA_MODEL : (detectDeviceModel() || '');
            if (m) { S.model = m; saveS(); }
        }
        // Точную модель Android-браузера можно получить только методом high-entropy
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues && /Android/.test(navigator.userAgent || '')) {
            try {
                navigator.userAgentData.getHighEntropyValues(['model']).then(function (res) {
                    var exact = (res && res.model || '').trim();
                    if (exact && exact !== 'iPhone' && exact !== 'K' && exact.length > 1 && isModelStub(S.model)) {
                        S.model = exact; saveS(); refreshViews();
                    }
                });
            } catch (e) {}
        }
    }

    function ic(name, cls, imgCls) {
        var v = IC[name] || '';
        if (v.charAt(0) === '/') {
            var imgc = imgCls ? ' ' + imgCls : '';
            return '<div class="icon ' + (cls || 'glassless') + '"><img class="icon-img' + imgc + '" src="' + v + '" alt=""></div>';
        }
        if (v.indexOf('data:image') === 0) {
            return '<div class="icon glassless"><img class="icon-img' + (imgCls ? ' ' + imgCls : '') + '" src="' + v + '" alt=""></div>';
        }
        return '<div class="icon ' + (cls || 'c-grey') + '"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + v + '</svg></div>';
    }

    // ===================== HELPERS =====================
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function sw(key) { return '<span class="switch' + (S[key] ? ' on' : '') + '" ontouchstart="pressSw(this)" onmousedown="pressSw(this)" onclick="event.stopPropagation();toggleSw(\'' + key + '\')"><span class="knob"></span></span>'; }
    function toggleSw(key) { S[key] = !S[key]; saveS(); toggleNow(event.currentTarget, S[key]); }

    function ksw(key, on) {
        if (S.extra[key] === undefined) { S.extra[key] = !!on; }
        return '<span class="switch' + (S.extra[key] ? ' on' : '') + '" ontouchstart="pressSw(this)" onmousedown="pressSw(this)" onclick="event.stopPropagation();toggleKey(\'' + key + '\')"><span class="knob"></span></span>';
    }
    function toggleKey(key) { S.extra[key] = !S.extra[key]; saveS(); toggleNow(event.currentTarget, S.extra[key]); }

    function toggleNow(el, on) {
        if (el) { el.classList.toggle('on', on); liquid(el); }
    }
    function pressSw(el) {
        if (!el) return;
        el.classList.add('pressed');
        liquid(el);
        setTimeout(function () { el.classList.remove('pressed'); }, 320);
    }
    function liquid(el) {
        if (!el) return;
        var s = document.createElement('span');
        s.className = 'liquid';
        el.appendChild(s);
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 650);
    }

    function pressBack(el) {
        if (!el) return;
        el.classList.add('pressed');
        liquid(el);
        setTimeout(function () { el.classList.remove('pressed'); }, 320);
    }

    function row(opts) {
        var html = '<div class="row"' + (opts.href ? ' onclick="push(\'' + opts.href + '\')"' : opts.on ? ' onclick="' + opts.on + '"' : '') + '">';
        if (opts.icon !== false) html += ic(opts.icon || 'gear', opts.cls || 'c-blue', opts.imgcls);
        html += '<div class="label"><span>' + esc(opts.t) + '</span>' + (opts.sub ? '<span class="sub">' + esc(opts.sub) + '</span>' : '') + '</div>';
        if (opts.val) html += '<span class="value">' + esc(opts.val) + '</span>';
        if (opts.switch) html += sw(opts.switch);
        if (opts.ksw) html += ksw(opts.ksw[0], opts.ksw[1]);
        if (opts.href || opts.on) html += '<span class="chevron">&#8250;</span>';
        html += '</div>';
        return html;
    }

    function group(header, rowsHtml) {
        return (header ? '<p class="group-header">' + header + '</p><section class="group">' + rowsHtml + '</section>' : '<section class="group">' + rowsHtml + '</section>');
    }

    var VALUES = {
        wifi: true, bt: true
    };

    // ===================== NAVIGATION =====================
    var stack = ['main'];
    var animating = false;
    var navTimer = null;

    function pageHTML(id) {
        var p = PAGES[id];
        var body = p.body();
        if (id === 'main') {
            return '<div class="view active" id="v-main">' + body + '</div>';
        }
        return '<div class="view view-top" id="v-' + id + '"><div class="view-content">' + body + '</div></div>';
    }

    function buildAll() {
        var v = document.getElementById('views');
        v.innerHTML = '';
        for (var id in PAGES) {
            var sc = document.createElement('div');
            sc.innerHTML = pageHTML(id);
            v.appendChild(sc.firstChild);
        }
        var last = document.getElementById('v-main');
        if (last && !last.classList.contains('active')) last.classList.add('active');
    }

    // Перерисовать значения на всех страницах без навигации
    function refreshViews() {
        for (var id in PAGES) {
            var v = document.getElementById('v-' + id);
            if (!v) continue;
            if (id === 'main') {
                v.innerHTML = PAGES.main.body();
            } else {
                var vc = v.querySelector('.view-content');
                if (vc) vc.innerHTML = PAGES[id].body();
            }
        }
    }

    // Очистить инлайн-стили, оставшиеся после анимаций (display не трогаем — видимость только через .active)
    function resetViewStyles(el) {
        if (!el) return;
        el.style.transition = '';
        el.style.transform = '';
        el.style.opacity = '';
        el.style.zIndex = '';
    }

    function showOnly(id) {
        for (var key in PAGES) {
            var v = document.getElementById('v-' + key);
            if (!v) continue;
            v.style.display = '';
            v.style.transition = '';
            v.style.transform = '';
            v.style.opacity = '';

            if (key === id) v.classList.add('active');
            else v.classList.remove('active');

    // Надёжный сброс флага анимации (даже если таймер потерян)
    function clearNav() {
        if (navTimer) { clearTimeout(navTimer); navTimer = null; }
        animating = false;
    }

    // Единая кнопка назад: видна только если стек глубже главного экрана
    function updateBackBtn() {
        var b = document.getElementById('backBtn');
        var show = stack.length > 1;
        if (b) {
            if (show) b.classList.add('show');
            else b.classList.remove('show');
            b.setAttribute('aria-hidden', show ? 'false' : 'true');
        }
        var tn = document.getElementById('topNav');
        if (tn) {
            tn.classList.toggle('show', show);
            if (show) {
                var cur = stack[stack.length - 1];
                var p = PAGES[cur];
                var tt = document.getElementById('topNavTitle');
                if (tt && p) tt.textContent = p.title;
            }
        }
    }

    function show(id) {
        if (animating) return false;
        animating = true;
        var cur = document.getElementById('v-' + stack[stack.length - 1]);
        var next = document.getElementById('v-' + id);
        if (!cur || !next) { animating = false; return false; }
        var tn = document.getElementById('topNav');
        if (tn) {
            tn.classList.add('show');
            var tt = document.getElementById('topNavTitle');
            var p = PAGES[id];
            if (tt && p) tt.textContent = p.title;
        }
        // Новый экран едет справа поверх, старая вкладка уезжает влево на 50%
        cur.classList.add('active');
        cur.style.display = 'block';
        cur.style.transition = 'none';
        cur.style.transform = 'translateX(0)';
        cur.style.zIndex = 1;
        next.classList.add('active');
        next.style.display = 'block';
        next.style.transition = 'none';
        next.style.transform = 'translateX(100%)';
        next.style.zIndex = 2;
        void next.offsetWidth;
        cur.style.transition = 'transform 0.45s cubic-bezier(0.32,0.72,0.24,1)';
        cur.style.transform = 'translateX(-50%)';
        next.style.transition = 'transform 0.45s cubic-bezier(0.32,0.72,0.24,1)';
        next.style.transform = 'translateX(0)';
        navTimer = setTimeout(function () {
            cur.classList.remove('active');
            resetViewStyles(cur);
            cur.style.display = '';
            stack.push(id);
            clearNav();
            updateBackBtn();
        }, 460);
        return true;
    }

    function push(id) {
        // Не пушить дубликаты: если id уже есть в стеке, вернуться к нему
        var idx = -1;
        for (var i = 0; i < stack.length; i++) {
            if (stack[i] === id) { idx = i; break; }
        }
        if (idx !== -1) {
            // Уже в этом экране — ничего не делаем
            if (idx === stack.length - 1) return;
            // иначе — откатиться назад до него
            popTo(idx);
            return;
        }
        if (id === 'custom') {
            var cv = document.getElementById('v-custom');
            if (cv) cv.querySelector('.view-content').innerHTML = PAGES.custom.body();
        }
        show(id);
    }

    function popTo(idx) {
        if (animating) return;
        animating = true;
        // Откатить стек до позиции idx и показать соответствующий экран
        var target = stack[idx];
        var cur = document.getElementById('v-' + (stack[stack.length - 1]));
        var nx = document.getElementById('v-' + target);
        if (!cur || !nx) { clearNav(); stack.length = idx + 1; updateBackBtn(); return; }
        var tn = document.getElementById('topNav');
        if (tn) {
            tn.classList.add('show');
            var tt = document.getElementById('topNavTitle');
            var p = PAGES[target];
            if (tt && p) tt.textContent = p.title;
        }
        cur.classList.add('active');
        cur.style.display = 'block';
        cur.style.transition = 'none';
        cur.style.transform = 'translateX(0)';
        cur.style.opacity = '1';
        cur.style.zIndex = 2;
        nx.classList.add('active');
        nx.style.display = 'block';
        nx.style.transition = 'none';
        nx.style.transform = 'translateX(-50%)';
        nx.style.opacity = '1';
        nx.style.zIndex = 1;
        void cur.offsetWidth;
        cur.style.transition = 'transform 0.45s cubic-bezier(0.32,0.72,0.24,1)';
        cur.style.transform = 'translateX(100%)';
        nx.style.transition = 'transform 0.45s cubic-bezier(0.32,0.72,0.24,1)';
        nx.style.transform = 'translateX(0)';
        navTimer = setTimeout(function () {
            resetViewStyles(cur);
            cur.classList.remove('active');
            nx.classList.add('active');
            cur.style.display = '';
            nx.style.display = '';
            stack.length = idx + 1;
            clearNav();
            updateBackBtn();
        }, 460);
    }

    var homeTaps = 0, homeTimer = null;
    function homeTap() {
        homeTaps++;
        if (homeTaps === 1) {
            homeTimer = setTimeout(function () { homeTaps = 0; }, 350);
        } else {
            clearTimeout(homeTimer); homeTaps = 0;
            push('custom');
        }
    }

    function pop() {
        if (animating) return;
        if (stack.length <= 1) { updateBackBtn(); return; }
        animating = true;
        var curTop = stack[stack.length - 1];
        var prev = stack[stack.length - 2];
        var cur = document.getElementById('v-' + curTop);
        var nx = document.getElementById('v-' + prev);
        if (!cur || !nx) { clearNav(); updateBackBtn(); return; }
        var tn = document.getElementById('topNav');
        if (tn) {
            tn.classList.add('show');
            var tt = document.getElementById('topNavTitle');
            var p = PAGES[prev];
            if (tt && p) tt.textContent = p.title;
        }
        cur.style.transition = 'none';
        cur.style.transform = 'translateX(0)';
        cur.style.opacity = '1';
        cur.classList.add('active');
        cur.style.display = 'block';
        cur.style.zIndex = 2;
        nx.classList.add('active');
        nx.style.display = 'block';
        nx.style.transition = 'none';
        nx.style.transform = 'translateX(-50%)';
        nx.style.opacity = '1';
        nx.style.zIndex = 1;
        void cur.offsetWidth;
        cur.style.transition = 'transform 0.45s cubic-bezier(0.32,0.72,0.24,1)';
        cur.style.transform = 'translateX(100%)';
        nx.style.transition = 'transform 0.45s cubic-bezier(0.32,0.72,0.24,1)';
        nx.style.transform = 'translateX(0)';
        navTimer = setTimeout(function () {
            resetViewStyles(cur);
            cur.classList.remove('active');
            nx.classList.add('active');
            cur.style.display = '';
            nx.style.display = '';
            stack.pop();
            clearNav();
            updateBackBtn();
        }, 460);
    }

    function pickAvatar() {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.style.display = 'none';
        inp.onchange = function () {
            var f = inp.files && inp.files[0];
            if (!f) return;
            var rd = new FileReader();
            rd.onload = function () {
                var img = new Image();
                img.onload = function () {
                    var s = 400, w = img.width, h = img.height;
                    var sc = Math.max(s / w, s / h);
                    var nw = Math.round(w * sc), nh = Math.round(h * sc);
                    var cv = document.createElement('canvas');
                    cv.width = s; cv.height = s;
                    var ctx = cv.getContext('2d');
                    ctx.fillStyle = '#1c1c1e';
                    ctx.fillRect(0, 0, s, s);
                    ctx.drawImage(img, Math.round((s - nw) / 2), Math.round((s - nh) / 2), nw, nh);
                    S.avatar = cv.toDataURL('image/jpeg', 0.85);
                    saveS();
                    refresh('login'); refresh('icloud'); refresh('main');
                };
                img.src = rd.result;
            };
            rd.readAsDataURL(f);
        };
        document.body.appendChild(inp);
        inp.click();
    }

    document.addEventListener('DOMContentLoaded', function () {
        // inject .view-header style already present
        buildAll();
        initSwipeBack();
    });

    // ===================== EDGE SWIPE BACK (iOS style) =====================
    var swipeStartX = 0, swipeStartY = 0, swipeTracking = false, swipeDeltaX = 0, swipeGestureActive = false;
    var EDGE_ZONE = 26;
    var snapThreshold = 42;

    function initSwipeBack() {
        var views = document.getElementById('views');
        var currentSwipe = null;
        views.addEventListener('touchstart', function (e) {
            if (stack.length <= 1) return;
            var t = e.touches[0];
            if (t.clientX <= EDGE_ZONE) {
                currentSwipe = { startX: t.clientX, startY: t.clientY, active: true };
                swipeTracking = true;
            }
        }, { passive: true });
        views.addEventListener('touchmove', function (e) {
            if (!currentSwipe || !currentSwipe.active) return;
            var t = e.touches[0];
            var dx = t.clientX - currentSwipe.startX;
            var dy = t.clientY - currentSwipe.startY;
            if (swipeTracking && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                swipeGestureActive = true;
                e.preventDefault();
                var topId = stack[stack.length - 1];
                var prevId = stack[stack.length - 2];
                var cur = document.getElementById('v-' + topId);
                var nx = document.getElementById('v-' + prevId);
                if (cur && nx) {
                    if (nx.style.display === 'none') { nx.style.display = 'block'; nx.style.transform = 'translateX(-50%)'; nx.style.zIndex = ''; }
                    nx.classList.add('active');
                    cur.classList.add('active');
                    if (cur.style.display === 'none') cur.style.display = 'block';
                    cur.style.zIndex = 2;
                    cur.style.transition = 'none';
                    nx.style.transition = 'none';
                    var tn = document.getElementById('topNav');
                    if (tn) {
                        tn.classList.add('show');
                        var tt = document.getElementById('topNavTitle');
                        var p = PAGES[prevId];
                        if (tt && p) tt.textContent = p.title;
                    }
                    var pct = Math.max(0, Math.min(1, dx / 280));
                    cur.style.transform = 'translateX(' + pct * 100 + '%)';
                    nx.style.transform = 'translateX(' + (-50 + pct * 50) + '%)';
                    currentSwipe.lastX = t.clientX;
                }
            }
        }, { passive: false });
        views.addEventListener('touchend', function (e) {
            if (!currentSwipe || !currentSwipe.active) return;
            if (!swipeGestureActive) { currentSwipe = null; swipeTracking = false; return; }
            var topId = stack[stack.length - 1];
            var prevId = stack[stack.length - 2];
            var cur = document.getElementById('v-' + topId);
            var nx = document.getElementById('v-' + prevId);
            var tx = e.changedTouches[0].clientX;
            var dx = tx - currentSwipe.startX;
            var doPop = dx > snapThreshold && cur;
            if (doPop) {
                if (nx) { nx.style.display = 'block'; nx.style.zIndex = ''; nx.classList.add('active'); nx.style.transition = 'transform 0.45s cubic-bezier(0.22,0.61,0.36,1)'; nx.style.transform = 'translateX(0)'; }
                if (cur) { cur.style.transition = 'transform 0.45s cubic-bezier(0.22,0.61,0.36,1)'; cur.style.transform = 'translateX(100%)'; }
                setTimeout(function () {
                    if (cur) { cur.style.display = ''; cur.classList.remove('active'); resetViewStyles(cur); }
                    if (nx) { nx.classList.add('active'); nx.style.display = ''; }
                    stack.pop();
                    updateBackBtn();
                }, 460);
            } else {
                if (cur) { cur.style.transition = 'transform 0.45s cubic-bezier(0.22,0.61,0.36,1)'; cur.style.transform = 'translateX(0)'; }
                if (nx) { nx.style.transition = 'transform 0.45s cubic-bezier(0.22,0.61,0.36,1)'; nx.style.transform = 'translateX(-50%)'; }
                setTimeout(function () {
                    if (cur) resetViewStyles(cur);
                    if (nx) { nx.classList.remove('active'); nx.style.display = ''; resetViewStyles(nx); }
                }, 460);
            }
            currentSwipe = null;
            swipeTracking = false;
            swipeGestureActive = false;
            animating = false;
        });
    }
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('dragstart', function (e) { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
    document.addEventListener('copy', function (e) { e.preventDefault(); });
    document.addEventListener('cut', function (e) { e.preventDefault(); });
    </script>
